['Contexto financeiro (aba Receitas)','Entre 2025 e 2026 a receita cresceu e as fontes se diversificaram. A cobertura da SOBRE 2026 (mais de 2 mil participantes) foi a primeira de maior valor financeiro, e trouxe novas despesas com equipe e deslocamentos.',['Riscos: financiamentos de duração limitada, receitas de serviços variáveis, distâncias e custos de permanência no território','Plano: estruturar captação, melhorar o acompanhamento financeiro, manter parcerias e ampliar serviços preservando a independência editorial','Em resultado negativo: avaliar coletivamente recursos, despesas e prioridades, protegendo a remuneração da equipe e as produções']],
['Mudanças no orçamento do ciclo atual','Ajustes e remanejamentos pontuais por deslocamentos, imprevistos, custos de produção e novas parcerias.',['Saldo em 20/11/2026: R$ 27.000 (R$ 20.000 do FAJ e R$ 7.000 do Instituto Unibanco), previsto para as últimas remunerações, o último episódio do podcast, contabilidade e despesas de encerramento até dezembro','Pequenos saldos dos projetos com a SOBRE e o Museu Iaiá Procópia, com prestação de contas em andamento']]];

function tabs(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-k="${k}" aria-selected="false">${l}</button>`).join('');
 $('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k)show(k)}}
function show(k){if(!TABS.some(t=>t[0]===k))k='resumo';
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===k));
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
 if(location.hash!=='#'+k)history.replaceState(null,'','#'+k)}

const tot=RUB.reduce((a,r)=>a+r[1],0),faj=RUB.reduce((a,r)=>a+r[2],0);
const recTot=(a)=>REC.filter(r=>r[3]===a&&r[5]==='rec').reduce((s,r)=>s+r[4],0);
function resumo(){
 $('#resumo').innerHTML=`<div class="grid">
 <div class="card kpi"><b>${R(150000)}</b><span>Valor solicitado ao FAJ</span></div>
 <div class="card kpi o"><b>${R(tot)}</b><span>Orçamento total de 2027 (FAJ cobre ${P(faj/tot)})</span></div>
 <div class="card kpi b"><b>10</b><span>Pessoas na equipe, custo de ${R(96000)}</span></div>
 <div class="card kpi"><b>${R(27000)}</b><span>Saldo em 20/11/2026</span></div></div>
 <div class="two"><div class="card"><h2>Identificação</h2><dl class="dc" style="padding:0;margin:0">
 <dt>Organização</dt><dd>Rede Kalunga Comunicações</dd><dt>Período da renovação</dt><dd>Dezembro de 2026 a novembro de 2027</dd>
 <dt>Alteração de dados cadastrais</dt><dd>Sem resposta registrada na planilha</dd></dl></div>
 <div class="card"><h2>Para onde vai o dinheiro</h2><div class="leg"><span><s style="background:var(--g)"></s>FAJ</span><span><s style="background:var(--ol)"></s>Outras fontes</span></div>
 ${RUB.map(r=>`<div class="row"><span>${r[0].split(/[ /]/)[0]}</span><div class="bar"><i style="width:${r[2]/r[1]*100}%"></i></div><span class="n">${R(r[1])}</span></div>`).join('')}</div></div>
 <div class="card" style="margin-top:12px"><h2>Receitas confirmadas por ano</h2>
 ${[2025,2026].map(a=>`<div class="row"><span>${a}</span><div class="bar" style="background:var(--bl)"><i style="width:${recTot(a)/320000*100}%;background:var(--b)"></i></div><span>${R(recTot(a))}</span></div>`).join('')}
 <p class="sub">Em 2027 há ${R(100000)} confirmados a receber (Unibanco) e ${R(75000)} potenciais (FAJ). O pedido de renovação está sujeito à aprovação.</p></div>`}

function orc(){
 $('#orcamento').innerHTML=`<p class="sub" style="margin-bottom:12px">Período do orçamento: 01/12/2026 a 30/11/2027. Clique numa linha para ver o detalhamento.</p>
 <div class="leg"><span><s style="background:var(--g)"></s>Financiado pelo FAJ</span><span><s style="background:var(--ol)"></s>Outras fontes</span></div>
 <div class="tw"><table><thead><tr><th>Rubrica</th><th class="n">Custo total</th><th class="n">FAJ</th><th class="n">Outras</th><th>% FAJ</th></tr></thead><tbody>
 ${RUB.map((r,i)=>`<tr class="rb" data-i="${i}" style="cursor:pointer"><td>${r[0]}</td><td class="n">${R(r[1])}</td><td class="n">${R(r[2])}</td><td class="n">${R(r[1]-r[2])}</td>
 <td><div class="bar"><i style="width:${r[2]/r[1]*100}%"></i></div>${P(r[2]/r[1])}</td></tr>
 <tr hidden id="d${i}"><td colspan="5" style="background:var(--bg);color:var(--mut)">${r[3]}</td></tr>`).join('')}</tbody>
 <tfoot><tr><td>Total</td><td class="n">${R(tot)}</td><td class="n">${R(faj)}</td><td class="n">${R(tot-faj)}</td><td>${P(faj/tot)}</td></tr></tfoot></table></div>`;
 $('#orcamento').onclick=e=>{const t=e.target.closest('.rb');if(t){const d=$('#d'+t.dataset.i);d.hidden=!d.hidden}}}

function equipe(){
 const pessoal=RUB[0];
 $('#equipe').innerHTML=`<div class="grid">
 <div class="card kpi"><b>10</b><span>Pessoas</span></div>
 <div class="card kpi o"><b>${R(pessoal[1])}</b><span>Custo anual</span></div>
 <div class="card kpi b"><b>${R(pessoal[2])}</b><span>Parcela prevista do FAJ</span></div>
 <div class="card kpi"><b>${R(pessoal[1]-pessoal[2])}</b><span>Outras fontes previstas</span></div>
 </div>`;
}

function receitas(){
 const st={};
 $('#receitas').innerHTML=`<div class="grid">
 <div class="card kpi"><b>${R(recTot(2025))}</b><span>Recebido em 2025</span></div><div class="card kpi"><b>${R(recTot(2026))}</b><span>Recebido em 2026</span></div>
 <div class="card kpi b"><b>${R(100000)}</b><span>Confirmado a receber em 2027</span></div><div class="card kpi o"><b>${R(150000)}</b><span>Potencial: FAJ Ciclo II (R$ 75.000 em 2026 e 2027)</span></div></div>
 <p class="sub">Financiadores confirmados, exceto FAJ: 4 em 2025, 7 em 2026 e 1 em 2027. Recursos não confirmados não entram na receita.</p><br>
 <div class="chips" id="rf">${[['all','Todos'],['rec','Recebido'],['rcb','A receber'],['pot','Potencial']].map((x,i)=>`<button class="chip" aria-pressed="${i==0}" data-v="${x[0]}">${x[1]}</button>`).join('')}
 ${['Todos os anos',2025,2026,2027].map((y,i)=>`<button class="chip" aria-pressed="${i==0}" data-y="${i?y:0}">${y}</button>`).join('')}</div>
 <input type="search" id="q" placeholder="Buscar financiador ou projeto">
 <div class="tw"><table><thead><tr><th>Financiador</th><th>Projeto</th><th>Ano</th><th class="n">Valor</th><th>Status</th><th>Entrada</th></tr></thead><tbody id="rb"></tbody><tfoot><tr><td colspan="3">Total filtrado</td><td class="n" id="rt"></td><td colspan="2"></td></tr></tfoot></table></div>`;
 let s='all',y=0;
 const draw=()=>{const q=$('#q').value.toLowerCase();const L=REC.filter(r=>(s==='all'||r[5]===s)&&(!y||r[3]==y)&&(r[0]+r[2]).toLowerCase().includes(q));
  $('#rb').innerHTML=L.map(r=>`<tr title="${r[7]}"><td>${r[0]}<br><small style="color:var(--mut)">${r[1]}</small></td><td>${r[2]}<br><small style="color:var(--mut)">${r[7]}</small></td><td>${r[3]}</td><td class="n">${R(r[4])}</td><td><span class="tag ${ST[r[5]][1]}">${ST[r[5]][0]}</span></td><td>${dt(r[6])}</td></tr>`).join('')||'<tr><td colspan="6">Nenhum resultado para esse filtro.</td></tr>';
  $('#rt').textContent=R(L.reduce((a,r)=>a+r[4],0))};
 draw();$('#q').oninput=draw;
 $('#rf').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.v){s=b.dataset.v;}else{y=+b.dataset.y}
  document.querySelectorAll('#rf .chip').forEach(x=>{if(!!x.dataset.v===!!b.dataset.v)x.setAttribute('aria-pressed',x===b)});draw()}}

function plano(){
 const cats=['Todos',...new Set(PL.map(p=>p[0]))];
 $('#plano').innerHTML=`<p class="sub" style="margin-bottom:12px">${PL.length} atividades ligadas às rubricas do orçamento.</p><div class="chips" id="pf">${cats.map((c,i)=>`<button class="chip" aria-pressed="${i==0}" data-v="${c}">${c}</button>`).join('')}</div><div id="pl"></div>`;
 const draw=c=>{$('#pl').innerHTML=PL.filter(p=>c==='Todos'||p[0]===c).map(p=>`<details><summary><span>${p[1]}</span><span class="tag t3" style="white-space:nowrap;align-self:flex-start">${p[4]}</span></summary><div class="dc"><dl>
  <dt>Resultado esperado</dt><dd>${p[2]}</dd><dt>Indicador e evidência</dt><dd>${p[3]}</dd><dt>Rubricas</dt><dd>${p[5]}</dd><dt>Apoio desejado do FAJ</dt><dd>${p[6]}</dd></dl></div></details>`).join('')};
 draw('Todos');$('#pf').onclick=e=>{const v=e.target.dataset.v;if(!v)return;document.querySelectorAll('#pf .chip').forEach(b=>b.setAttribute('aria-pressed',b===e.target));draw(v)}}

function impacto(){
 const mx=45000;
 $('#impacto').innerHTML=`<div class="card" style="margin-bottom:14px"><h2>Seguidores e inscritos, 2025 × 2026</h2><div class="leg"><span><s style="background:var(--ol)"></s>2025</span><span><s style="background:var(--b)"></s>2026</span></div>
 ${BARS.map(b=>`<div class="row"><span>${b[0]}</span><div><div class="bar" style="height:7px;margin-bottom:3px"><i style="width:${b[1]/mx*100}%;background:var(--o)"></i></div><div class="bar" style="height:7px;background:var(--bl)"><i style="width:${b[2]/mx*100}%;background:var(--b)"></i></div></div><span>${b[1].toLocaleString('pt-BR')} → ${b[2].toLocaleString('pt-BR')}</span></div>`).join('')}
 <p class="sub">O Instagram foi lido em recortes de 30 dias que não coincidem, então a variação de visualizações deve ser lida com cautela.</p></div>
 <div class="tw"><table><thead><tr><th>Canal</th><th>2025</th><th>2026 (atual)</th><th>Variação</th><th>Observações</th></tr></thead><tbody>
 ${IMP.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join('')}</tbody></table></div>`}

function narrativa(){
 $('#narrativa').innerHTML=`<p class="sub" style="margin-bottom:12px">Síntese das respostas do formulário narrativo e dos campos de contexto da planilha.</p>`+
 NAR.map((n,i)=>`<details ${i==0?'open':''}><summary><span>${n[0]}</span></summary><div class="dc"><p>${n[1]}</p><ul class="cl">${n[2].map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`).join('')}

$('#l3').src='/prestacao-de-contas/marcas/rede-kalunga.png';
$('#l1').src='/prestacao-de-contas/marcas/faj-azul.png';
tabs();resumo();orc();equipe();receitas();plano();impacto();narrativa();
show(location.hash.slice(1));addEventListener('hashchange',()=>show(location.hash.slice(1)));
</script></body></html>
