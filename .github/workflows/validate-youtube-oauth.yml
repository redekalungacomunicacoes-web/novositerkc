name: Validate YouTube OAuth
on:
  pull_request:
    paths:
      - 'supabase/functions/youtube-oauth/**'
      - 'src/app/pages/admin/YouTubeConnection.tsx'
      - 'src/app/pages/admin/AdminConfiguracoes.tsx'
      - 'supabase/migrations/*rkc_youtube_oauth.sql'
      - '.github/workflows/validate-youtube-oauth.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config supabase/functions/youtube-oauth/index.ts
