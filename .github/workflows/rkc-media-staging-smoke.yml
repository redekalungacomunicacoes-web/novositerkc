name: RKC isolated media cache staging smoke

on:
  push:
    branches:
      - codex/rkc-public-media-cache
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Run isolated Cloudflare HTTP integration suite
        env:
          RKC_MEDIA_WORKER_URL: https://rkc-media-cache-staging-20261114.redekalungacomunicacoes.workers.dev
        run: node scripts/test-cloudflare-staging-fixtures.mjs
      - name: Verify production site and Supabase with read-only HTTP requests
        env:
          SUPABASE_URL: https://yycfqeymdsjyulexwrlb.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_J76dp3g1EyY8GT52M-sYEw_zYirWFVF
          RKC_SITE_URL: https://kalungacomunicacoes.org
        run: node scripts/test-production-readonly-smoke.mjs
