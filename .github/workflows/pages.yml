name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/pages.yml"
      - "src/app/pages/public/Accountability/**"
      - "src/app/pages/admin/Financeiro/**"
      - "src/app/routes.tsx"
      - "supabase/migrations/*finance_accountability*"
      - "tests/*accountability*.test.mjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc -p tsconfig.financeiro.json --noEmit
      - run: node --test tests/finance-accountability-workflow.test.mjs tests/finance-accountability-sheet-sync.test.mjs tests/faj-accountability-exports.test.mjs
      - run: npm run build
      - name: Generate search metadata, structured data and sitemap
        if: github.event_name != 'pull_request'
        run: node scripts/generate-article-seo.mjs

      - name: Prepare SPA entry points
        if: github.event_name != 'pull_request'
        run: |
          cp dist/index.html dist/404.html
          install -D -m 644 dist/index.html dist/admin/financeiro/prestacoes/index.html
          for route in faj-ii-ciclo faj-ii-ciclo/financeiro faj-ii-ciclo/narrativo; do
            destination="dist/prestacao-de-contas/$route/index.html"
            install -D -m 644 dist/index.html "$destination"
            sed -i 's|<title>[^<]*</title>|<title>Prestação de Contas FAJ II Ciclo · Rede Kalunga</title>|; s|name="description" content="[^"]*"|name="description" content="Orçamento, relatório narrativo e indicadores do FAJ II Ciclo da Rede Kalunga."|' "$destination"
            sed -i '/<\/head>/i\    <meta property="og:title" content="Prestação de Contas FAJ II Ciclo · Rede Kalunga" />\n    <meta property="og:description" content="Orçamento, relatório narrativo e indicadores da Rede Kalunga." />' "$destination"
          done

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
