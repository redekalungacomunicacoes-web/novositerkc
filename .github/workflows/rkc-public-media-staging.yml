name: RKC Public Media Cache Staging
on:
  pull_request:
    paths:
      - 'cloudflare/workers/rkc-public-materias-cache/**'
      - 'supabase/functions/drive-media/**'
      - 'tests/cloudflare-public-media-cache.test.mjs'
      - 'tests/drive-media-visibility.test.mjs'
      - 'scripts/test-cloudflare-public-media.mjs'
      - '.github/workflows/rkc-public-media-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exercise isolated staging Worker over HTTPS
        env:
          RKC_MEDIA_WORKER_URL: https://rkc-public-materias-staging-20261114.redekalungacomunicacoes.workers.dev
        run: node scripts/test-cloudflare-public-media.mjs
