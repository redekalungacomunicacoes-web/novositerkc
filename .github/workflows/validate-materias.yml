name: Validate Materias
on:
  pull_request:
    paths:
      - 'src/app/pages/*Materia*.tsx'
      - 'src/app/pages/admin/AdminMateriaForm.tsx'
      - 'src/app/pages/admin/AdminConfiguracoes.tsx'
      - 'src/app/components/RKCCard.tsx'
      - 'src/app/components/SiteSeo.tsx'
      - 'src/lib/materiaMediaOptimization.ts'
      - 'src/lib/supabase.ts'
      - 'supabase/functions/_shared/materia-drive.ts'
      - 'supabase/functions/drive-media/index.ts'
      - 'tests/drive-media-visibility.test.mjs'
      - 'tests/cloudflare-cache-purge-auth.test.mjs'
      - 'tests/materia*.test.mjs'
      - 'tests/cloudflare-public-media-cache.test.mjs'
      - 'tests/public-media-url.test.mjs'
      - 'cloudflare/workers/rkc-public-materias-cache/**'
      - 'src/lib/publicMediaUrl.ts'
      - 'src/lib/publicMediaCache.ts'
      - 'src/app/pages/MateriaDetalhes.tsx'
      - 'src/app/pages/ProjetoDetalhes.tsx'
      - 'src/app/repositories/projectRepository.ts'
      - 'src/app/pages/admin/AdminProjetoForm.tsx'
      - 'supabase/functions/cloudflare-cache-purge/**'
      - 'supabase/config.toml'
      - 'scripts/test-cloudflare-public-media.mjs'
      - 'scripts/generate-article-seo.mjs'
      - '.github/workflows/pages.yml'
      - 'scripts/generate-pilot-seo.mjs'
      - 'public/robots.txt'
      - 'tsconfig.materias.json'
      - '.github/workflows/validate-materias.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Cloudflare Worker cache entrypoints (dry run)
        run: |
          cd cloudflare/workers/rkc-public-materias-cache
          npx --yes wrangler@4.107.0 deploy --dry-run --outdir "$RUNNER_TEMP/rkc-worker-dry-run"
      - run: npx tsc -p tsconfig.materias.json
      - run: node --test tests/materia*.test.mjs tests/team-drive.test.mjs tests/cloudflare-public-media-cache.test.mjs tests/public-media-url.test.mjs tests/drive-media-visibility.test.mjs tests/cloudflare-cache-purge-auth.test.mjs
      - run: npm run build
      # Real HTTPS smoke tests run only against the isolated staging Worker workflow.
