name: Validate Project Sharing
on:
  pull_request:
    paths:
      - 'scripts/generate-article-seo.mjs'
      - 'tests/project-share-seo.test.mjs'
      - '.github/workflows/validate-project-sharing.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/project-share-seo.test.mjs
      - run: npm run build
